# Per-bot configuration. Loaded by `bot run <name>`.

[agent]
# name defaults to the bot directory name; uncomment to override.
# name = "ada"

# --- backend ---
# "ollama"     — local Ollama server (default).
# "openrouter" — OpenRouter or any OpenAI-compatible host.
#                 Reads OPENROUTER_API_KEY from env (or set api_key here).
backend = "ollama"

# Default: Gemma 3 1B via Ollama. Tiny, fast, runs on CPU.
# Other small options:
#   ollama:     "llama3.2:1b", "llama3.2:3b", "qwen2.5:3b"
#   openrouter: "google/gemma-3-1b-it", "meta-llama/llama-3.2-3b-instruct"
model = "gemma3:1b"

# Optional overrides.
# base_url = "http://localhost:11434"   # ollama default
# api_key  = "sk-..."                   # openrouter; prefer env var

# --- generation ---
max_tokens  = 256
temperature = 0.7

# --- agent loop ---
# Recent turns of THIS conversation to include in each call. Tight on a
# 1B model — past conversations come in compressed via EPISODIC summaries.
history_window = 8

# EPISODIC summaries to surface in the system prompt.
episodic_limit = 12

# Run consolidation automatically on session end (writes EPISODIC entry,
# patches SEMANTIC). Disable for one-shot or stateless chats.
auto_consolidate = true

# Optional extra system-prompt text appended after memory.
# extra_system = "You are speaking Spanish today."
