<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingomaxxing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green:        #58CC02;
        --green-dark:   #58A700;
        --green-light:  #D7FFB8;
        --green-text:   #58A700;
        --blue:         #1CB0F6;
        --blue-dark:    #1899D6;
        --blue-light:   #DDF4FF;
        --red:          #FF4B4B;
        --red-dark:     #EA2B2B;
        --red-light:    #FFDFE0;
        --red-text:     #EA2B2B;
        --yellow:       #FFC800;
        --bg:           #FFFFFF;
        --bg-soft:      #F7F7F7;
        --border:       #E5E5E5;
        --border-soft:  #F0F0F0;
        --text:         #4B4B4B;
        --text-muted:   #777777;
        --text-dim:     #AFAFAF;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0; padding: 0;
        background: var(--bg-soft);
        color: var(--text);
        font-family: "Nunito", "Hiragino Maru Gothic Pro", -apple-system,
                     BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        gap: 0;
      }

      header {
        padding: 18px 4px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      header .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .lang-pair {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
      }
      .lang-pair select {
        appearance: none;
        -webkit-appearance: none;
        font-family: inherit;
        font-weight: 800;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text);
        background: var(--bg);
        border: 2px solid var(--border);
        border-bottom-width: 3px;
        border-radius: 10px;
        padding: 6px 28px 6px 10px;
        cursor: pointer;
        outline: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23777' d='M0 0l5 6 5-6z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 10px center;
      }
      .lang-pair select:hover { border-color: var(--blue); }
      .lang-pair select:focus { border-color: var(--blue); }
      .lang-pair .arrow {
        color: var(--text-dim);
        font-weight: 900;
        font-size: 14px;
      }
      .lang-pair button.swap {
        appearance: none;
        background: var(--bg);
        border: 2px solid var(--border);
        border-bottom-width: 3px;
        border-radius: 10px;
        width: 30px;
        height: 30px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 900;
        color: var(--text-muted);
        cursor: pointer;
        line-height: 1;
        padding: 0;
        transition: filter 0.1s, transform 0.05s;
      }
      .lang-pair button.swap:hover { color: var(--blue); border-color: var(--blue); }
      .lang-pair button.swap:active { transform: translateY(1px); border-bottom-width: 2px; }
      header h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.02em;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      header h1 .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px; height: 38px;
        background: var(--green);
        border-radius: 10px;
        color: white;
        font-weight: 900;
        font-size: 22px;
        box-shadow: 0 3px 0 var(--green-dark);
      }
      header .status {
        font-size: 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 0 rgba(255,75,75,0.5);
      }
      .dot.live {
        background: var(--green);
        animation: pulse 2.4s ease-in-out infinite;
      }
      .dot.thinking {
        background: var(--yellow);
        animation: pulse-yellow 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(88,204,2,0.4); }
        50%      { box-shadow: 0 0 0 6px rgba(88,204,2,0); }
      }
      @keyframes pulse-yellow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255,200,0,0.5); }
        50%      { box-shadow: 0 0 0 6px rgba(255,200,0,0); }
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 8px 4px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .msg { display: flex; }
      .msg.user { justify-content: flex-end; }
      .msg.user .bubble {
        max-width: 78%;
        padding: 10px 16px;
        background: var(--blue-light);
        color: var(--blue-dark);
        border: 2px solid #BDE7FF;
        border-radius: 16px 16px 4px 16px;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.4;
      }

      .msg.agent {
        gap: 10px;
        align-items: flex-start;
      }
      .msg.agent .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--bg);
        border: 3px solid var(--border);
        margin-top: 8px;
      }
      .msg.agent .bubble {
        max-width: calc(100% - 84px);
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .msg.agent .label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 800;
        padding-left: 4px;
      }
      .msg.agent .text {
        background: var(--bg);
        border: 2px solid var(--border);
        border-radius: 16px 16px 16px 4px;
        padding: 12px 16px;
        font-size: 15px;
        line-height: 1.45;
        color: var(--text);
        font-weight: 600;
      }

      form#composer {
        display: flex;
        gap: 10px;
        padding: 12px 0 18px;
        background: var(--bg-soft);
        border-top: 1px solid var(--border);
      }
      #composer textarea {
        flex: 1;
        resize: none;
        min-height: 48px;
        max-height: 160px;
        padding: 12px 16px;
        border-radius: 14px;
        background: var(--bg);
        color: var(--text);
        border: 2px solid var(--border);
        border-bottom-width: 3px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        outline: none;
        transition: border-color 0.15s;
      }
      #composer textarea:focus { border-color: var(--blue); }
      #composer textarea::placeholder {
        color: var(--text-dim);
        font-weight: 600;
      }

      #composer button {
        padding: 0 22px;
        height: 48px;
        border-radius: 14px;
        background: var(--green);
        color: white;
        border: none;
        border-bottom: 4px solid var(--green-dark);
        font-family: inherit;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        cursor: pointer;
        transition: filter 0.1s, transform 0.05s;
      }
      #composer button:hover:not(:disabled) { filter: brightness(1.05); }
      #composer button:active:not(:disabled) {
        transform: translateY(2px);
        border-bottom-width: 2px;
      }
      #composer button:disabled {
        background: var(--border);
        color: var(--text-dim);
        border-bottom-color: #D0D0D0;
        cursor: not-allowed;
      }

      /* Scrollbar — Duolingo's chrome is super clean */
      #messages::-webkit-scrollbar { width: 8px; }
      #messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="row">
          <h1><span class="mark">L</span>Lingomaxxing</h1>
          <div class="status">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">ready</span>
          </div>
        </div>
        <div class="row">
          <div class="lang-pair">
            <span>Speak</span>
            <select id="native-lang" aria-label="Native language"></select>
            <button type="button" class="swap" id="swap-lang" aria-label="Swap languages" title="Swap languages">⇄</button>
            <span>Learn</span>
            <select id="target-lang" aria-label="Target language"></select>
          </div>
        </div>
      </header>

      <div id="messages"></div>

      <form id="composer" autocomplete="off">
        <textarea
          id="composer-input"
          placeholder="Ask the tutor anything…"
          rows="1"
        ></textarea>
        <button type="submit" id="composer-send" disabled>Send</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
