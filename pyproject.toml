[project]
name = "impact-bot"
version = "0.1.0"
description = "Chatbot agent framework with personality, memory, and session logs — designed for small language models."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bot = "bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
